name: tapos-be CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    services:
      tapos_db:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_root_password
          MYSQL_DATABASE: tapos_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -ptest_root_password" 
          --health-interval=10s 
          --health-timeout=5s 
          --health-retries=3

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9 # Matches your previous setup

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Prisma Generate
        run: pnpm exec prisma generate

      - name: Sync Database Schema
        run: pnpm exec prisma db push --skip-generate
        env:
          DATABASE_URL: mysql://root:test_root_password@localhost:3306/tapos_test

      - name: Run Tests
        run: pnpm exec jest --config ./jest.config.js
        env:
          NODE_ENV: test
          DATABASE_URL: mysql://root:test_root_password@localhost:3306/tapos_test
          # Use default dummy values for CI tests if secrets aren't set
          JWT_SECRET: testsecret
          API_PREFIX: /api/v1